# UNTESTED template (never run). Copy to .github/workflows/tests.yml at the repository root.
name: tests
on: [push, pull_request]
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install numpy pandas scipy scikit-learn pydantic pyyaml pyarrow
      - run: python -X utf8 _showcase/scripts/run_tests.py
        env:
          TTPMAP_ROOT: ${{ github.workspace }}
