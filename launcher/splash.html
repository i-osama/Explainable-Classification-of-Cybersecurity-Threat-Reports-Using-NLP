<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Starting the explainer</title>
<style>
  :root { --paper: #F4F6F9; --ink: #14213D; --soft: #3A4A66; --blue: #1D4E89; --amber: #B7791F; --cell: #DCE3EC; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--paper); color: var(--ink);
         font-family: "Segoe UI", system-ui, sans-serif; }
  main { width: min(720px, calc(100vw - 32px)); }
  h1 { font-family: Bahnschrift, "Segoe UI", sans-serif; font-weight: 600; font-size: clamp(1.8rem, 4vw, 2.6rem); margin: 0 0 .3rem; }
  p { margin: .3rem 0; color: var(--soft); line-height: 1.5; }
  /* 14 tactic columns of the ATT&CK matrix; cells light up while the models load */
  .matrix { display: grid; grid-template-columns: repeat(14, 1fr); gap: 5px; margin: 1.6rem 0 1.2rem; }
  .matrix i { display: block; aspect-ratio: 1.6; background: var(--cell); border-radius: 2px; }
  .matrix i.on { background: var(--blue); transition: background .25s; }
  .matrix i.hit { background: var(--amber); }
  #status { font-weight: 600; color: var(--ink); }
  a { color: var(--blue); }
  @media (prefers-reduced-motion: reduce) { .matrix i.on { transition: none; } }
</style>
</head>
<body>
<main>
  <h1>ATT&amp;CK threat-report explainer</h1>
  <p>Starting on this PC. The models and the thesis data are inside this folder; nothing is downloaded.</p>
  <div class="matrix" id="m" aria-hidden="true"></div>
  <p id="status" role="status">Waiting for the local server on port {{PORT}}...</p>
  <p id="hint">This page opens the app by itself. <a href="http://127.0.0.1:{{PORT}}">Open the app now</a></p>
</main>
<script>
  const PORT = "{{PORT}}", APP = "http://127.0.0.1:" + PORT, m = document.getElementById("m"), cells = [];
  for (let i = 0; i < 14 * 6; i++) { const c = document.createElement("i"); m.appendChild(c); cells.push(c); }
  const still = matchMedia("(prefers-reduced-motion: reduce)").matches;
  let k = 0;
  const sweep = still ? null : setInterval(() => {            // one sweep across the tactics, column by column
    const col = k % 14, row = Math.floor(k / 14) % 6;
    cells[row * 14 + col].classList.toggle("on");
    k++;
  }, 45);
  const t0 = Date.now(), status = document.getElementById("status");
  async function poll() {
    try {
      await fetch(APP + "/_stcore/health", { mode: "no-cors", cache: "no-store" });   // resolves once the server answers
      clearInterval(sweep);
      cells.forEach((c, i) => c.className = i % 9 === 4 ? "hit" : "on");
      status.textContent = "Ready. Opening the app...";
      setTimeout(() => location.replace(APP), 400);
    } catch (e) {
      const s = Math.round((Date.now() - t0) / 1000);
      if (s > 90) status.textContent = "Still starting after " + s + " s. If nothing changes, read the message in the black window.";
      setTimeout(poll, 500);
    }
  }
  poll();
</script>
</body>
</html>
